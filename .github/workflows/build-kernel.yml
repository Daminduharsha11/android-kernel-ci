name: Kernel Builder

on:
  workflow_dispatch:
    inputs:
      KERNEL_REPO:
        description: 'Kernel Git Repository URL'
        required: true
        type: string
      KERNEL_BRANCH:
        description: 'Branch to Checkout'
        required: true
        default: 'main'
        type: string
      DEFCONFIG:
        description: 'Defconfig Name (e.g., vendor_defconfig)'
        required: true
        type: string
      ENABLE_KSU:
        description: 'Enable KernelSU'
        required: true
        default: false
        type: boolean
      ENABLE_LTO:
        description: 'Enable LTO / ThinLTO'
        required: true
        default: true
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout AnyKernel3 Zipper
        uses: actions/checkout@v4
        with:
          repository: AnonymousWP/AnyKernel3
          path: AnyKernel3

      - name: Clone Dynamic Kernel Source
        run: |
          git clone --depth=1 -b ${{ inputs.KERNEL_BRANCH }} ${{ inputs.KERNEL_REPO }} kernel-source

      - name: Install Toolchain & Dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y \
            build-essential libncurses-dev bison flex libssl-dev bc git wget zip
          git clone --depth=1 https://github.com/llvm/llvm-project.git toolchain/llvm

      - name: Compile Kernel & Apply Flags
        env:
          ARCH: arm64
          SUBARCH: arm64
          KBUILD_BUILD_USER: "GitHub"
          KBUILD_BUILD_HOST: "Actions"
        run: |
          export PATH="${{ github.workspace }}/toolchain/llvm/bin:$PATH"
          cd kernel-source
          mkdir -p out

          # Apply config
          make O=out CC=clang ${{ inputs.DEFCONFIG }}

          # Dynamic Flags Injection
          if [ "${{ inputs.ENABLE_KSU }}" = "true" ]; then
            echo "Enabling KernelSU..."
            ./scripts/config --file out/.config -e CONFIG_KSU
          else
            ./scripts/config --file out/.config -d CONFIG_KSU
          fi

          if [ "${{ inputs.ENABLE_LTO }}" = "false" ]; then
            echo "Disabling LTO..."
            ./scripts/config --file out/.config -d CONFIG_THINLTO -d CONFIG_LTO_CLANG
          fi

          make O=out CC=clang olddefconfig

          # Compile
          make -j$(nproc) O=out \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu-

      - name: Package with AnyKernel3
        run: |
          IMG=$(find kernel-source/out/arch/arm64/boot/ -name "Image*" -type f | head -n 1)
          if [ -z "$IMG" ]; then
            echo "Error: Kernel image not found!"
            exit 1
          fi

          cp "$IMG" AnyKernel3/
          cd AnyKernel3
          zip -r9 ../flashable-kernel.zip *

      - name: Send Zip to Telegram
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          document: flashable-kernel.zip
          caption: |
            ✅ *Kernel Build Successful!*
            • Repo: `${{ inputs.KERNEL_REPO }}`
            • Branch: `${{ inputs.KERNEL_BRANCH }}`
            • Defconfig: `${{ inputs.DEFCONFIG }}`
            • KernelSU: `${{ inputs.ENABLE_KSU }}`
