name: Kernel Builder

on:
  workflow_dispatch:
    inputs:
      KERNEL_REPO:
        description: 'Kernel git repo (https)'
        required: true
        default: 'https://github.com/ximi-mojito/android_kernel_xiaomi_mojito'
        type: string
      KERNEL_BRANCH:
        description: 'Branch, tag or commit SHA'
        required: true
        default: '17.0'
        type: string
      SUBMODULES:
        description: 'Fetch git submodules (some trees keep drivers/techpack in submodules)'
        required: true
        default: false
        type: boolean
      ARCH:
        description: 'Kernel architecture'
        required: true
        default: 'arm64'
        type: choice
        options: [arm64, arm]
      DEFCONFIG:
        description: 'Defconfig inside arch/<ARCH>/configs/ (can include a subdir, e.g. vendor/foo_defconfig)'
        required: true
        default: 'mojito_defconfig'
        type: string
      EXTRA_FRAGMENTS:
        description: 'Extra config fragments to merge, space separated (path from kernel root or from arch/<ARCH>/configs/)'
        required: false
        default: ''
        type: string
      CONFIG_ENABLE:
        description: 'Options to force on, space separated, without CONFIG_ prefix'
        required: false
        default: ''
        type: string
      CONFIG_DISABLE:
        description: 'Options to force off, space separated, without CONFIG_ prefix'
        required: false
        default: 'KVM KVM_ARM_HOST COMPAT_VDSO'
        type: string
      LTO:
        description: 'ThinLTO: default = leave defconfig alone, on = force, off = disable (clang only)'
        required: true
        default: 'default'
        type: choice
        options: [default, 'on', 'off']
      ENABLE_KSU:
        description: 'Enable KernelSU (non-GKI setup)'
        required: true
        default: false
        type: boolean
      KSU_REF:
        description: 'KernelSU tag/branch for non-GKI kernels'
        required: true
        default: 'v0.9.5'
        type: string
      CLANG_REPO:
        description: 'Clang repo, optionally with #branch (e.g. https://...proton-clang#master). Empty = build with GCC'
        required: false
        default: 'https://github.com/kdrag0n/proton-clang'
        type: string
      GCC64_REPO:
        description: 'Optional 64-bit GCC/binutils repo, optionally #branch. Empty = use Ubuntu aarch64-linux-gnu-'
        required: false
        default: ''
        type: string
      GCC32_REPO:
        description: 'Optional 32-bit GCC/binutils repo, optionally #branch. Empty = use Ubuntu arm-linux-gnueabi-'
        required: false
        default: ''
        type: string
      EXTRA_MAKE_ARGS:
        description: 'Extra make arguments, space separated (e.g. LLVM=1 LLVM_IAS=1)'
        required: false
        default: ''
        type: string
      RUNNER:
        description: 'GitHub runner image (22.04 for old toolchains like Proton, 24.04 for newer ones)'
        required: true
        default: 'ubuntu-22.04'
        type: choice
        options: [ubuntu-22.04, ubuntu-24.04]
      DEVICE_NAMES:
        description: 'Device codenames for the zip check, comma separated (empty = no device check)'
        required: false
        default: 'mojito,sunny'
        type: string
      BOOT_BLOCK:
        description: 'Boot partition block'
        required: true
        default: '/dev/block/bootdevice/by-name/boot'
        type: string
      IS_SLOT_DEVICE:
        description: 'A/B device? (auto / 0 / 1)'
        required: true
        default: '0'
        type: choice
        options: [auto, '0', '1']
      FLASH_DTBO:
        description: 'Also flash the kernel-built dtbo.img (only if the tree builds one)'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ${{ inputs.RUNNER }}
    timeout-minutes: 120
    env:
      KERNEL_REPO: ${{ inputs.KERNEL_REPO }}
      KERNEL_BRANCH: ${{ inputs.KERNEL_BRANCH }}
      SUBMODULES: ${{ inputs.SUBMODULES }}
      ARCH: ${{ inputs.ARCH }}
      DEFCONFIG: ${{ inputs.DEFCONFIG }}
      EXTRA_FRAGMENTS: ${{ inputs.EXTRA_FRAGMENTS }}
      CONFIG_ENABLE: ${{ inputs.CONFIG_ENABLE }}
      CONFIG_DISABLE: ${{ inputs.CONFIG_DISABLE }}
      LTO: ${{ inputs.LTO }}
      ENABLE_KSU: ${{ inputs.ENABLE_KSU }}
      KSU_REF: ${{ inputs.KSU_REF }}
      CLANG_REPO: ${{ inputs.CLANG_REPO }}
      GCC64_REPO: ${{ inputs.GCC64_REPO }}
      GCC32_REPO: ${{ inputs.GCC32_REPO }}
      EXTRA_MAKE_ARGS: ${{ inputs.EXTRA_MAKE_ARGS }}
      DEVICE_NAMES: ${{ inputs.DEVICE_NAMES }}
      BOOT_BLOCK: ${{ inputs.BOOT_BLOCK }}
      IS_SLOT_DEVICE: ${{ inputs.IS_SLOT_DEVICE }}
      FLASH_DTBO: ${{ inputs.FLASH_DTBO }}

    steps:
      - name: Validate inputs
        run: |
          chk() { # name value regex
            local re="$3"
            [[ "$2" =~ $re ]] || { echo "::error::$1 has unexpected characters"; exit 1; }
          }
          for v in KERNEL_REPO CLANG_REPO GCC64_REPO GCC32_REPO; do
            val="${!v}"
            [ -z "$val" ] && continue
            case "$val" in https://*) ;; *) echo "::error::$v must be an https URL"; exit 1 ;; esac
          done
          chk KERNEL_BRANCH   "$KERNEL_BRANCH"   '^[A-Za-z0-9._/@+-]+$'
          chk DEFCONFIG       "$DEFCONFIG"       '^[A-Za-z0-9_./-]+$'
          chk EXTRA_FRAGMENTS "$EXTRA_FRAGMENTS" '^[A-Za-z0-9_./ -]*$'
          chk CONFIG_ENABLE   "$CONFIG_ENABLE"   '^[A-Za-z0-9_ ]*$'
          chk CONFIG_DISABLE  "$CONFIG_DISABLE"  '^[A-Za-z0-9_ ]*$'
          chk EXTRA_MAKE_ARGS "$EXTRA_MAKE_ARGS" '^[A-Za-z0-9_=./:+, -]*$'
          chk KSU_REF         "$KSU_REF"         '^[A-Za-z0-9._/@+-]+$'
          chk BOOT_BLOCK      "$BOOT_BLOCK"      '^/[A-Za-z0-9/_.-]+$'
          chk DEVICE_NAMES    "$DEVICE_NAMES"    '^[A-Za-z0-9_, -]*$'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential bc bison flex libssl-dev libelf-dev libncurses-dev \
            cpio lz4 zip curl git python3 python-is-python3 ccache device-tree-compiler \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi
          sudo apt-get install -y --no-install-recommends libtinfo5 || echo "libtinfo5 not available, continuing"

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: kernel-${{ inputs.ARCH }}
          max-size: 2G

      - name: Checkout AnyKernel3
        uses: actions/checkout@v4
        with:
          repository: osm0sis/AnyKernel3
          path: AnyKernel3

      - name: Clone kernel source
        run: |
          if [[ "$KERNEL_BRANCH" =~ ^[0-9a-f]{7,40}$ ]]; then
            git init kernel-source
            git -C kernel-source remote add origin "$KERNEL_REPO"
            git -C kernel-source fetch --depth=1 origin "$KERNEL_BRANCH"
            git -C kernel-source checkout FETCH_HEAD
          else
            git clone --depth=1 -b "$KERNEL_BRANCH" "$KERNEL_REPO" kernel-source
          fi
          if [ "$SUBMODULES" = "true" ]; then
            git -C kernel-source submodule update --init --recursive --depth=1
          fi
          test -d "kernel-source/arch/$ARCH" || { echo "::error::arch/$ARCH not found, wrong ARCH for this tree?"; exit 1; }

      - name: Clone toolchains
        run: |
          clone_tc() { # dir spec(url[#branch])
            local dir="$1" spec="$2" url br=""
            url="${spec%%#*}"
            [[ "$spec" == *#* ]] && br="${spec#*#}"
            if [ -n "$br" ]; then git clone --depth=1 -b "$br" "$url" "$dir"
            else git clone --depth=1 "$url" "$dir"; fi
            echo "$PWD/$dir/bin" >> "$GITHUB_PATH"
          }
          find_prefix() { ls "$1/bin" 2>/dev/null | grep -m1 -- '-gcc$' | sed 's/gcc$//' || true; }

          CROSS64="aarch64-linux-gnu-"
          CROSS32="arm-linux-gnueabi-"

          if [ -n "$CLANG_REPO" ]; then
            clone_tc clang "$CLANG_REPO"
            echo "USE_CLANG=1" >> "$GITHUB_ENV"
          else
            echo "No CLANG_REPO set, building with GCC"
            echo "USE_CLANG=0" >> "$GITHUB_ENV"
          fi

          if [ -n "$GCC64_REPO" ]; then
            clone_tc gcc64 "$GCC64_REPO"
            p="$(find_prefix gcc64)"
            [ -n "$p" ] && CROSS64="$p" || echo "::warning::could not detect GCC64 prefix, using $CROSS64"
          fi

          if [ -n "$GCC32_REPO" ]; then
            clone_tc gcc32 "$GCC32_REPO"
            p="$(find_prefix gcc32)"
            [ -n "$p" ] && CROSS32="$p" || echo "::warning::could not detect GCC32 prefix, using $CROSS32"
          fi

          echo "CROSS64=$CROSS64" >> "$GITHUB_ENV"
          echo "CROSS32=$CROSS32" >> "$GITHUB_ENV"

      - name: Integrate KernelSU
        if: ${{ inputs.ENABLE_KSU }}
        run: |
          cd kernel-source
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s "$KSU_REF"
          test -d KernelSU || { echo "KernelSU setup failed"; exit 1; }

      - name: Configure kernel
        run: |
          cd kernel-source
          mkdir -p out

          if [ "$ARCH" = "arm64" ]; then CROSS_MAIN="$CROSS64"; else CROSS_MAIN="$CROSS32"; fi

          if [ "$USE_CLANG" = "1" ]; then
            COMMON=(O=out ARCH="$ARCH" SUBARCH="$ARCH" CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm \
                                OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip \
                                CLANG_TRIPLE="$CROSS_MAIN" CROSS_COMPILE="$CROSS_MAIN" CROSS_COMPILE_ARM32="$CROSS32")
            CCWRAP="ccache clang"
          else
            COMMON=(O=out ARCH="$ARCH" SUBARCH="$ARCH" CROSS_COMPILE="$CROSS_MAIN" CROSS_COMPILE_ARM32="$CROSS32")
            CCWRAP="ccache ${CROSS_MAIN}gcc"
          fi
          EXTRA=()
          read -ra EXTRA <<< "$EXTRA_MAKE_ARGS"
          declare -p COMMON EXTRA CCWRAP > ../make_vars.sh

          if [ ! -f "arch/$ARCH/configs/$DEFCONFIG" ]; then
            echo "::error::arch/$ARCH/configs/$DEFCONFIG not found. Available:"
            find "arch/$ARCH/configs" -name '*defconfig' | sed "s|arch/$ARCH/configs/||" | sort | head -80
            exit 1
          fi

          yes "" | make "${COMMON[@]}" "$DEFCONFIG"

          if [ -n "$EXTRA_FRAGMENTS" ]; then
            FRAGS=()
            for f in $EXTRA_FRAGMENTS; do
              if   [ -f "$f" ]; then FRAGS+=("$f")
              elif [ -f "arch/$ARCH/configs/$f" ]; then FRAGS+=("arch/$ARCH/configs/$f")
              else echo "::error::fragment $f not found"; exit 1; fi
            done
            KCONFIG_CONFIG=out/.config ./scripts/kconfig/merge_config.sh -m -O out out/.config "${FRAGS[@]}"
          fi

          for o in $CONFIG_DISABLE; do ./scripts/config --file out/.config -d "${o#CONFIG_}" || true; done
          for o in $CONFIG_ENABLE;  do ./scripts/config --file out/.config -e "${o#CONFIG_}" || true; done

          if [ "$ENABLE_KSU" = "true" ]; then
            ./scripts/config --file out/.config -e MODULES -e KSU -e KPROBES -e HAVE_KPROBES -e KPROBE_EVENTS
          else
            ./scripts/config --file out/.config -d KSU || true
          fi

          case "$LTO" in
            on)
              if [ "$USE_CLANG" != "1" ]; then
                echo "::warning::LTO requested but building with GCC, skipping"
              elif grep -rqs "config LTO_CLANG" arch init Kconfig* 2>/dev/null; then
                ./scripts/config --file out/.config -e LTO_CLANG -e THINLTO || true
              else
                echo "::warning::This tree has no LTO_CLANG option, skipping LTO"
              fi ;;
            off)
              ./scripts/config --file out/.config -d LTO_CLANG -d THINLTO -d LTO || true ;;
            *) : ;;
          esac

          yes "" | make "${COMMON[@]}" olddefconfig

          for o in $CONFIG_ENABLE; do
            o="${o#CONFIG_}"
            grep -Eq "^CONFIG_${o}=[ym]" out/.config || echo "::warning::CONFIG_${o} did not stick after olddefconfig"
          done

          if [ "$ENABLE_KSU" = "true" ]; then
            for opt in KSU KPROBES KPROBE_EVENTS; do
              grep -q "^CONFIG_${opt}=y" out/.config || { echo "::error::CONFIG_${opt} did not stick after olddefconfig (a dependency is missing)"; exit 1; }
            done
          fi

      - name: Compile kernel
        env:
          CCACHE_SLOPPINESS: time_macros
          KBUILD_BUILD_TIMESTAMP: "Thu Jan  1 00:00:00 UTC 2026"
        run: |
          cd kernel-source
          source ../make_vars.sh
          export CCACHE_DIR="${CCACHE_DIR:-$HOME/.ccache}"
          make -j"$(nproc)" "${COMMON[@]}" "${EXTRA[@]}" \
            CC="$CCWRAP" \
            KCFLAGS="-Wno-error" \
            KBUILD_BUILD_USER="GitHub" KBUILD_BUILD_HOST="Actions" 2>&1 | tee ../build.log
          make "${COMMON[@]}" -s kernelversion > ../kernel_version.txt

      - name: Package with AnyKernel3
        run: |
          BOOT="kernel-source/out/arch/$ARCH/boot"
          IMG=""
          for name in Image.gz-dtb Image.lz4-dtb Image-dtb Image.gz Image.lz4 Image zImage-dtb zImage; do
            if [ -f "$BOOT/$name" ]; then IMG="$BOOT/$name"; break; fi
          done
          [ -n "$IMG" ] || { echo "Kernel image not found in $BOOT"; ls -la "$BOOT"; exit 1; }
          echo "Using image: $IMG"

          cd AnyKernel3
          rm -rf .git .github README.md LICENSE modules patch ramdisk
          cp "../$IMG" .
          HAVE_DTBO=0
          if [ "$FLASH_DTBO" = "true" ]; then
            if [ -f "../$BOOT/dtbo.img" ]; then cp "../$BOOT/dtbo.img" . && HAVE_DTBO=1
            else echo "::warning::FLASH_DTBO set but the tree did not build dtbo.img"; fi
          fi

          if [[ "$IMG" != *-dtb ]] && [ -f "../$BOOT/dts/dtb" ]; then cp "../$BOOT/dts/dtb" .; fi

          KVER=$(cat ../kernel_version.txt)
          DEVCHECK=1
          [ -z "$(echo "$DEVICE_NAMES" | xargs)" ] && DEVCHECK=0
          {
            echo "### AnyKernel3 Ramdisk Mod Script"
            echo "properties() { '"
            echo "kernel.string=Custom Kernel $KVER"
            echo "do.devicecheck=$DEVCHECK"
            echo "do.modules=0"
            echo "do.systemless=0"
            echo "do.cleanup=1"
            echo "do.cleanuponabort=0"
            if [ "$DEVCHECK" = "1" ]; then
              i=1
              IFS=',' read -ra DEVS <<< "$DEVICE_NAMES"
              for d in "${DEVS[@]}"; do
                echo "device.name$i=$(echo "$d" | xargs)"
                i=$((i+1))
              done
            fi
            echo "supported.versions="
            echo "supported.patchlevels="
            echo "supported.vendorpatchlevels="
            echo "'; }"
            echo "BLOCK=$BOOT_BLOCK;"
            echo "IS_SLOT_DEVICE=$IS_SLOT_DEVICE;"
            echo "RAMDISK_COMPRESSION=auto;"
            echo "PATCH_VBMETA_FLAG=auto;"
            echo ". tools/ak3-core.sh;"
            echo "split_boot;"
            echo "flash_boot;"
          } > anykernel.sh

          ZIP="Kernel-${KVER}-$(date +%Y%m%d-%H%M).zip"
          zip -r9 "../$ZIP" ./* -x '.git*'
          echo "ZIP_NAME=$ZIP" >> "$GITHUB_ENV"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-build
          path: |
            *.zip
            build.log
            kernel-source/out/.config
          if-no-files-found: warn

      - name: Send zip to Telegram
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TG_TOKEN" ] || [ -z "$TG_CHAT" ]; then
            echo "::notice::Telegram secrets not set, skipping upload"
            exit 0
          fi
          if [ "$(stat -c%s "$ZIP_NAME")" -gt 50000000 ]; then
            echo "::warning::Zip is over 50 MB, Telegram Bot API will reject it. Grab it from the artifacts."
            exit 0
          fi
          KVER=$(cat kernel_version.txt)
          CAPTION="✅ <b>Kernel build successful</b>
          • Repo: <code>${KERNEL_REPO}</code>
          • Branch: <code>${KERNEL_BRANCH}</code>
          • Defconfig: <code>${DEFCONFIG}</code>
          • Version: <code>${KVER}</code>
          • KernelSU: <code>${ENABLE_KSU}</code>
          • LTO: <code>${LTO}</code>"

          RESPONSE=$(curl -sS -F chat_id="$TG_CHAT" -F parse_mode=HTML \
            -F caption="$CAPTION" -F document=@"$ZIP_NAME" \
            "https://api.telegram.org/bot${TG_TOKEN}/sendDocument")

          echo "Telegram API Response: $RESPONSE"
          if echo "$RESPONSE" | grep -q '"ok":true'; then
            echo "Successfully sent zip to Telegram!"
          else
            echo "Failed to send zip to Telegram."
            exit 1
          fi

      - name: Notify failure on Telegram
        if: failure()
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TG_TOKEN" ] || [ -z "$TG_CHAT" ]; then exit 0; fi
          [ -f build.log ] && tail -n 40 build.log > fail_tail.txt || echo "No build log" > fail_tail.txt
          curl -sS -F chat_id="$TG_CHAT" -F caption="❌ Kernel build failed (last lines of log)" \
            -F document=@fail_tail.txt "https://api.telegram.org/bot${TG_TOKEN}/sendDocument" || true
